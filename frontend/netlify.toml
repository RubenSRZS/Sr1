[build]
  # REACT_APP_BUILD_TIME : date de mise en ligne affichée sur le tableau de bord
  command = "REACT_APP_BUILD_TIME=$(date +%s) yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  GENERATE_SOURCEMAP = "false"

# L'appli parle au serveur Google (clients, devis, factures) via la même adresse :
# pas de réglage CORS à faire, et le mode hors ligne peut garder les données.
[[redirects]]
  from = "/api/*"
  to = "https://devis.sr-renovation.fr/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/asset-manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
